<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郵差人生模擬器 V11.0 究極優化版</title>
    <style>
        :root {
            --green-main: #008751;
            --green-dark: #005c37;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 15px; color: #333;
        }
        .container {
            max-width: 600px; margin: 0 auto; background: var(--card-bg);
            border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 20px;
        }
        h1 { color: var(--green-main); text-align: center; margin-top: 0; font-size: 22px; }
        
        .status-bar {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
            background: #e8f5e9; padding: 10px; border-radius: 10px; margin-bottom: 12px;
            text-align: center; font-size: 12px;
        }
        .status-item span { display: block; font-weight: bold; font-size: 14px; color: var(--green-dark); }

        .stats-panel {
            background: #f1f8e9; border: 1px solid #c8e6c9; border-radius: 10px;
            padding: 12px; margin-bottom: 15px;
        }
        .stats-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 14px; }
        .btn-add {
            background: var(--green-main); color: white; border: none;
            border-radius: 5px; padding: 2px 10px; font-weight: bold; cursor: pointer;
        }
        .btn-add:disabled { background: #ccc; cursor: not-allowed; }

        .event-card {
            background: #fafafa; border: 2px solid #e0e0e0; border-radius: 12px;
            padding: 15px; margin-bottom: 15px; min-height: 90px;
        }
        .event-title { font-size: 16px; font-weight: bold; color: #1a237e; margin-bottom: 8px; }
        .event-desc { font-size: 14px; line-height: 1.5; color: #424242; }

        .choices-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .btn-choice {
            width: 100%; background: #fff; color: #333; border: 2px solid var(--green-main);
            padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px;
            cursor: pointer; text-align: left; transition: all 0.2s;
        }
        .btn-choice:hover { background: var(--green-main); color: white; }

        .btn-action {
            width: 100%; background-color: var(--green-main); color: white; border: none;
            padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-bottom: 8px;
        }
        .btn-action:disabled { background-color: #a5d6a7; cursor: not-allowed; }
        .btn-exam { background-color: #0288d1; }
        .btn-job { background-color: #f57c00; }

        .setup-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
        input, select {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;
            box-sizing: border-box; font-size: 14px; font-family: inherit;
        }
        .hidden { display: none !important; }
        .log-box {
            background: #fffde7; border-left: 4px solid #fbc02d; padding: 10px;
            margin-top: 10px; font-size: 13px; border-radius: 4px; line-height: 1.5;
        }
        .job-section {
            background: #fff3e0; border: 1px solid #ffe0b2; border-radius: 10px;
            padding: 10px; margin-bottom: 12px;
        }
        .job-title { font-weight: bold; font-size: 14px; color: #e65100; margin-bottom: 6px; }
        .opportunity-notice {
            background: #e1f5fe; border: 1px solid #81d4fa; border-radius: 6px;
            padding: 8px; margin-bottom: 8px; font-size: 12px; color: #0277bd;
        }
        .prologue-box {
            background: #e8f5e9; border-left: 4px solid var(--green-main); padding: 12px;
            margin-bottom: 15px; font-size: 13px; border-radius: 4px; line-height: 1.6; color: #2e7d32;
        }
        .chat-simulation {
            background: #e1f5fe; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 13px;
        }
        .chat-msg { background: #fff; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h1>📮 郵差人生模擬器 V11.0</h1>

    <div id="setup-page-1">
        <h3>Step 1: 基本角色資料</h3>
        <div class="setup-group">
            <label for="player-name">郵務士姓名：</label>
            <input type="text" id="player-name" value="郵小弟">
        </div>
        <div class="setup-group">
            <label for="player-age">入職起始年齡（手動輸入）：</label>
            <input type="number" id="player-age" value="25" min="18" max="60">
        </div>
        <div class="setup-group">
            <label for="player-old-job">進郵局前的上一份職業（手動輸入）：</label>
            <input type="text" id="player-old-job" value="民營物流司機">
        </div>
        <div class="setup-group">
            <label for="player-section">剛進局初次職務選擇：</label>
            <select id="player-section">
                <option value="混投段">1. 混投段（平信/掛號/包裹混投）</option>
                <option value="快捷包裹段">2. 快捷包裹段（重包裹多、時效緊）</option>
            </select>
        </div>
        <div class="setup-group">
            <label for="player-code">選擇天賦傾向（隱藏至退休結算）：</label>
            <select id="player-code">
                <option value="A">【天賦 A】路線敏銳（路線熟練與人緣加成）</option>
                <option value="B">【天賦 B】靈敏應變（處事應變與向上管理加成）</option>
                <option value="C">【天賦 C】鋼鐵體魄（體能強度與路線熟練加成）</option>
            </select>
        </div>
        <button class="btn-action" onclick="startGame()">確認設定，正式進局報到！</button>
    </div>

    <div id="game-page" class="hidden">
        <div class="status-bar">
            <div class="status-item">年齡 / 職務<span id="stat-age">25歲</span></div>
            <div class="status-item">目前薪級 / 月薪<span id="stat-salary">55級 ($36,250)</span></div>
            <div class="status-item">生涯淨資產 (扣除生活費)<span id="stat-total-salary" style="color:#d32f2f;">$0</span></div>
            <div class="status-item">考績甲等累計<span id="stat-eval">0 次</span></div>
        </div>

        <div class="stats-panel">
            <div class="stats-header">
                <span>📊 屬性能力值 (範圍 1~20)</span>
                <span style="color:#d32f2f;">剩餘點數：<span id="stat-points">0</span></span>
            </div>
            <div class="stat-row">
                <span>⚡ 體能強度：<b id="val-stamina">10</b>/20</span>
                <button class="btn-add" id="btn-add-stamina" onclick="addPoint('stamina')">+1</button>
            </div>
            <div class="stat-row">
                <span>🗺️ 路線熟練度：<b id="val-route">10</b>/20</span>
                <button class="btn-add" id="btn-add-route" onclick="addPoint('route')">+1</button>
            </div>
            <div class="stat-row">
                <span>👔 向上管理：<b id="val-management">10</b>/20</span>
                <button class="btn-add" id="btn-add-management" onclick="addPoint('management')">+1</button>
            </div>
            <div class="stat-row">
                <span>📚 處事與應變：<b id="val-smart">10</b>/20</span>
                <button class="btn-add" id="btn-add-smart" onclick="addPoint('smart')">+1</button>
            </div>
            <div class="stat-row">
                <span>🤝 人緣社交：<b id="val-relationship">10</b>/20</span>
                <button class="btn-add" id="btn-add-relationship" onclick="addPoint('relationship')">+1</button>
            </div>
        </div>

        <div id="prologue-container"></div>

        <div class="event-card">
            <div class="event-title" id="event-title">準備出勤</div>
            <div class="event-desc" id="event-desc">點擊下方按鈕開始進行今年的業務！</div>
            <div id="log-container"></div>
        </div>

        <div class="choices-container" id="choices-container"></div>

        <button id="btn-main" class="btn-action" onclick="startYear()">進行今年業務</button>

        <div class="job-section hidden" id="job-section">
            <div class="job-title">🏆 今年出現的特殊職務/升遷機會！</div>
            <div id="opportunity-notice" class="opportunity-notice"></div>
            <button id="btn-job-night" class="btn-action btn-job hidden" onclick="applyJob('半夜接送收攬')">🌙 競逐職缺：半夜接送收攬</button>
            <button id="btn-job-day" class="btn-action btn-job hidden" onclick="applyJob('白天接送收攬')">☀️ 競逐職缺：白天接送收攬</button>
            <button id="btn-job-inspector" class="btn-action btn-job hidden" onclick="applyJob('郵務稽查')">🔍 競逐職缺：郵務稽查</button>
            <button id="btn-exam" class="btn-action btn-exam hidden" onclick="takeExam()">📝 參加內部升遷考試</button>
        </div>
    </div>

    <div id="result-page" class="hidden">
        <h2 id="result-header">🏆 郵差生涯榮退報告</h2>
        <div id="summary-content" style="line-height: 1.8; background:#fff8e1; padding:15px; border-radius:10px;"></div>
        <br>
        <button class="btn-action" onclick="location.reload()">重新體驗新人生</button>
    </div>
</div>

<script>
    const salaryTable = {
        55: 36250, 54: 37405, 53: 38640, 52: 39885, 51: 41130,
        50: 42370, 49: 43600, 48: 44850, 47: 46090, 46: 47325,
        45: 48560, 44: 49775, 43: 50470, 42: 51190, 41: 51890,
        40: 52590, 39: 53290, 38: 53995, 37: 54695, 36: 55395
    };

    let player = {
        name: "", code: "A", section: "混投段", age: 25, startAge: 25, role: "外勤郵務員（混投段）",
        oldJob: "", whyPost: "",
        salaryGrade: 55, 
        totalEarnings: 0,
        points: 5,
        stats: { stamina: 10, route: 10, management: 10, smart: 10, relationship: 10 },
        delivered: 0, gradeA: 0,
        examPassed: false,
        isFired: false,
        firedReason: "",
        badHabit: null // "smoke" 或 "betel" 或 null
    };

    const MIN_STAT = 1;
    const MAX_STAT = 20;

    const whyPostTemplates = [
        (job, age, workYrs) => `在上一份「${job}」行業打滾了約 ${workYrs} 年，每日承受血汗加班與薪資凍漲的摧殘。為了尋求穩定的生活保障與合理的勞動環境，你終於下定決心報考中華郵政，正式展開郵務士人生！`,
        (job, age, workYrs) => `厭倦了過去擔任「${job}」時無止盡的責任制與慣老闆壓榨。聽說郵局生活相對單純、見紅就休又有國營鐵飯碗保障，你毅然決然閉關苦讀，誓死拼上這局！`,
        (job, age, workYrs) => `曾經以為「${job}」這條路能走得長久，卻發現現實狠狠打了臉。眼看年紀漸增，為了給自己一個安定未來，你決定脫下前一份制服，換穿綠衣郵差大顯身手。`,
        (job, age, workYrs) => `身邊朋友紛紛上岸當公務員與國營職員，讓你再也坐不住。告別了過去的「${job}」生涯，你發誓要靠實力考進中華郵政，重新奪回人生主導權！`,
        (job, age, workYrs) => `每天待在室內做「${job}」做到懷疑人生，嚮往在外趴趴走又不用看客戶臉色。於是你狠下心來報考郵局外勤，準備用雙腿與油門征服大街小巷！`
    ];

    const commonEvents = [
        {
            title: "🌧️ 突如其來的暴雨考驗",
            desc: "送信送到一半突然下起傾盆大雨！但你發現自己沒帶雨衣也沒帶浴帽，信件跟包裹快要濕掉了！",
            options: [
                {
                    text: "a) 硬著頭皮送完！",

                {
                    text: "b) 請求稽查支援！",

                    changes: { smart: 1, management: -1 }, addPoints: 1, grade: false

            ]
        },
        {
            title: "📲 LINE 社交地獄爆發",
            desc: "午休手機滑太爽，不小心把私下的訊息誤傳到郵局大群組（內有局長、專員與全體同仁）！",
            options: [
                {
                    text: "按一下『刪除』（只有自己看不到）",
                    result: "慘了！全群組幾百個人都看到了，成為局內傳奇社會性死亡代表！",
                    changes: { management: -4, relationship: -4 }, addPoints: 0, grade: false
                },
                {
                    text: "手速極快秒按『收回』，並補一句『帳號被盜/好友傳錯』",
                    result: "雖然有幾個人看到，但你死不承認！靠著極強的心理素質撐過去了。",
                    changes: { smart: 2, management: -1 }, addPoints: 0, grade: false
                }
            ]
        },
        {
            title: "🏥 身體紅燈與手術抉擇",
            desc: "健康檢查報告出爐，醫生面色凝重地宣布你需要馬上動手術處理身體痼疾！",
            options: [
                {
                    text: "一. 乖乖配合動手術",
                    result: "住院開刀休養了一陣子，雖然花了一筆錢，但身體重獲新生，體能與狀態大為改善！",
                    changes: { stamina: 2 }, addPoints: 1, grade: false
                },
                {
                    text: "二. 不去醫院，在家硬撐休息就好",
                    result: "病情拖久惡化，送信到一半直接暈倒送醫，差點小命不保！",

                }
            ]
        },
        {
            title: "🐶 投遞途中遭遇惡犬死角埋伏",
            desc: "送信到一處透天厝，鐵門一開突然衝出一隻兇猛的大黑狗狂吠猛追，你當場嚇出一身冷汗！",
            options: [
                {
                    text: "a) 丟下手邊郵件拔腿狂奔，鞋子還跑掉一隻",
                    result: "雖然成功保住小命，但郵件散落滿地，被飼主與路人拍下影片檢舉狼狽相。",

                    text: "b) 冷靜拿出手上的大宗投遞單當盾牌，邊退邊喝斥",

    const rookieEvents = [

            title: "🛵 菜鳥犁田記",

            options: [
                {
                    text: "摸摸鼻子自認倒楣，自己爬起來拖車",

                {
                    text: "沿路回頭瘋狂找尋並挨家挨戶詢問",

                },

                    text: "急哭求助同仁幫忙尋找",
                    result: "在同仁熱心幫忙下找回，但被主管列為重點關切對象。",
                    changes: { relationship: 1, management: -2 }, addPoints: 0, grade: false
                }
            ]
        }
    ];

    const seniorEvents = [
        {
            title: "🦴 老鳥的慢性職業勞損",
            desc: "年過半百，長年搬重物與騎車讓五十肩與椎間盤突出雙重發作，早上起床腰都直不起來！",

                    text: "吞止痛藥硬撐，繼續拼送信",

    const badHabitEvents = [

            title: "🚬 不良嗜好危機：菸癮發作",

            options: [
                {
                    text: "下定決心參加局內戒菸門診！嘗試戒除不良嗜好",

                    changes: { stamina: -1 }
                }

        },
        {

            options: [
                {

                },
                {

    const jobSpecificEvents = {
        "外勤郵務員（混投段）": [
            {
                title: "⚖️ 訴訟文書的陷阱",
                desc: "送信送到一半，民眾突然攔住你，劈頭問你有沒有他的「訴訟文書」？",

            {

    function startGame() {
        let ageInput = parseInt(document.getElementById("player-age").value);
        if (isNaN(ageInput) || ageInput < 18) {
            alert("請輸入有效的起始年齡（至少 18 歲以上）！");
            return;
        }

        player.name = document.getElementById("player-name").value || "郵小弟";
        player.startAge = ageInput;
        player.age = ageInput;
        player.oldJob = document.getElementById("player-old-job").value || "各行各業勞工";
        player.section = document.getElementById("player-section").value;
        player.code = document.getElementById("player-code").value;

        // 不良嗜好隨機配置 (30% 抽菸, 10% 檳榔)
        let habitRoll = Math.random();
        if (habitRoll < 0.30) {
            player.badHabit = "smoke";
            player.stats.stamina -= 5;
        } else if (habitRoll < 0.40) {
            player.badHabit = "betel";
            player.stats.stamina -= 8;
        } else {
            player.badHabit = null;
        }

        let workYears = Math.max(1, player.startAge - 18 - 2);
        let randomTemplate = whyPostTemplates[Math.floor(Math.random() * whyPostTemplates.length)];
        player.whyPost = randomTemplate(player.oldJob, player.startAge, workYears);

        if (player.section === "快捷包裹段") {
            player.stats.stamina += 2;
            player.role = "外勤郵務員（快捷包裹段）";
        } else {
            player.stats.route += 2;
            player.role = "外勤郵務員（混投段）";
        }

        if (player.code === "A") { player.stats.route += 1; }
        if (player.code === "B") { player.stats.smart += 1; }
        if (player.code === "C") { player.stats.stamina += 1; }

        // 確保屬性開局不低於最低值
        for (let key in player.stats) {
            if (player.stats[key] < MIN_STAT) player.stats[key] = MIN_STAT;
            if (player.stats[key] > MAX_STAT) player.stats[key] = MAX_STAT;
        }

        document.getElementById("setup-page-1").classList.add("hidden");
        document.getElementById("game-page").classList.remove("hidden");

        let habitDesc = "";
        if (player.badHabit === "smoke") habitDesc = "<br><span style='color:#d32f2f;'>⚠️ 【帶有不良嗜好：抽菸】體力指數 -5，每年額外花費 3.6 萬元。</span>";
        if (player.badHabit === "betel") habitDesc = "<br><span style='color:#d32f2f;'>⚠️ 【帶有不良嗜好：吃檳榔】體力指數 -8，每年額外花費 6 萬元。</span>";

        document.getElementById("prologue-container").innerHTML = `
            <div class="prologue-box">
                📜 <b>【入職心路歷程】</b><br>
                你今年 <b>${player.startAge}</b> 歲。${player.whyPost} ${habitDesc}
            </div>
        `;

        updateUI();
    }

    function updateUI() {
        let currentMonthlySalary = salaryTable[player.salaryGrade] || 36250;
        let gradeText = player.salaryGrade === 36 ? "36級 (碰頂)" : `${player.salaryGrade}級`;

        document.getElementById("stat-age").innerText = `${player.age}歲 (${player.role})`;
        document.getElementById("stat-salary").innerText = `${gradeText} ($${currentMonthlySalary.toLocaleString()})`;
        document.getElementById("stat-total-salary").innerText = `$${player.totalEarnings.toLocaleString()}`;
        document.getElementById("stat-eval").innerText = `${player.gradeA} 次`;
        document.getElementById("stat-points").innerText = player.points;

        for (let key in player.stats) {
            if (player.stats[key] > MAX_STAT) player.stats[key] = MAX_STAT;
            if (player.stats[key] < MIN_STAT) player.stats[key] = MIN_STAT;
            
            document.getElementById(`val-${key}`).innerText = player.stats[key];
            let btn = document.getElementById(`btn-add-${key}`);
            if (btn) btn.disabled = (player.points <= 0 || player.stats[key] >= MAX_STAT);
        }

        let mainBtn = document.getElementById("btn-main");
        if (player.points > 0) {
            mainBtn.disabled = true;
            mainBtn.innerText = `請先配完點數！(還剩 ${player.points} 點)`;
        } else {
            mainBtn.disabled = false;
            mainBtn.innerText = player.age >= 65 ? "觀看榮退報告" : "進行今年業務";
        }

        checkCareerOpportunities();
    }

    function checkCareerOpportunities() {
        let yearsOfService = player.age - player.startAge;
        let jobSection = document.getElementById("job-section");
        let noticeBox = document.getElementById("opportunity-notice");
        
        let btnNight = document.getElementById("btn-job-night");
        let btnDay = document.getElementById("btn-job-day");
        let btnInspector = document.getElementById("btn-job-inspector");
        let btnExam = document.getElementById("btn-exam");

        btnNight.classList.add("hidden");
        btnDay.classList.add("hidden");
        btnInspector.classList.add("hidden");
        btnExam.classList.add("hidden");

        let availableNotice = [];

        if (player.role === "郵務稽查") {
            if (Math.random() < 0.20) {
                btnDay.classList.remove("hidden");
                availableNotice.push("☀️ 局內『白天接送收攬』有空缺！是否考慮轉任？");
            } else {
                jobSection.classList.add("hidden");
                return;
            }
        } else {
            if (yearsOfService > 0 && yearsOfService % 3 === 0 && !player.examPassed) {
                btnExam.classList.remove("hidden");
                availableNotice.push("📝 總公司舉辦 3 年一度的內部升遷大考，可報考轉內勤！");
            }

            if (yearsOfService >= 5 && player.role !== "半夜接送收攬" && Math.random() < 0.40) {
                btnNight.classList.remove("hidden");
                availableNotice.push("🌙 局內『半夜接送收攬』有空缺！");
            }

            if (yearsOfService >= 10 && player.role !== "白天接送收攬" && Math.random() < 0.24) {
                btnDay.classList.remove("hidden");
                availableNotice.push("☀️ 局內『白天接送收攬』有空缺！");
            }

            if (yearsOfService >= 15 && player.role !== "郵務稽查" && Math.random() < 0.30) {
                btnInspector.classList.remove("hidden");
                availableNotice.push("🔍 局內『郵務稽查』開放競爭！");
            }
        }

        if (availableNotice.length > 0) {
            jobSection.classList.remove("hidden");
            noticeBox.innerHTML = availableNotice.join("<br>");
        } else {
            jobSection.classList.add("hidden");
        }
    }

    function addPoint(statKey) {
        if (player.points > 0 && player.stats[statKey] < MAX_STAT) {
            player.stats[statKey]++;
            player.points--;
            updateUI();
        }
    }

    function startYear() {
        if (player.points > 0) return;
        if (player.age >= 65 || player.isFired) { endGame(false); return; }

        let prologueBox = document.getElementById("prologue-container");
        if (prologueBox) {
            prologueBox.innerHTML = "";
        }

        document.getElementById("btn-main").classList.add("hidden");
        document.getElementById("log-container").innerHTML = "";

        player.points += 1;

        // 檢查是否有屬性觸發最低值解職
        for (let key in player.stats) {
            if (player.stats[key] <= MIN_STAT) {
                player.isFired = true;
                let reasonMap = {
                    stamina: "體力耗盡至最低點，身體徹底失能無法負荷工作，強制失能退場！",
                    route: "路線熟練度降至谷底，天天迷路送錯郵件遭到革職！",
                    management: "向上管理與職場關係完全崩潰，遭到長官聯手報復革職！",
                    smart: "應變能力歸零，屢次惹出重大紕漏遭到解職！",
                    relationship: "人緣惡劣至極，全局同仁連署排擠並投訴至總公司遭到革職！"
                };
                player.firedReason = reasonMap[key];
                endGame(false);
                return;
            }
        }

        // 事件池選擇 (入職前三年菜鳥包、超過50歲老鳥包、不良嗜好事件)
        let yearsOfService = player.age - player.startAge;
        let evtPool = [...commonEvents];

        if (yearsOfService < 3) {
            evtPool = evtPool.concat(rookieEvents);
        }
        if (player.age >= 50) {
            evtPool = evtPool.concat(seniorEvents);
        }
        if (player.badHabit && Math.random() < 0.4) {
            evtPool = evtPool.concat(badHabitEvents);
        }

        if (jobSpecificEvents[player.role] && Math.random() < 0.6) {
            let specificPool = jobSpecificEvents[player.role];
            let evt = specificPool[Math.floor(Math.random() * specificPool.length)];
            triggerEvent(evt);
            return;
        }

        let evt = evtPool[Math.floor(Math.random() * evtPool.length)];
        triggerEvent(evt);
    }

    function triggerEvent(evt) {
        document.getElementById("event-title").innerText = `📅 【${player.age} 歲】 ${evt.title}`;
        document.getElementById("event-desc").innerHTML = evt.desc;

        let container = document.getElementById("choices-container");
        container.innerHTML = "";
        evt.options.forEach((opt) => {
            let btn = document.createElement("button");
            btn.className = "btn-choice";
            btn.innerText = opt.text;
            btn.onclick = () => processChoice(opt);
            container.appendChild(btn);
        });
        
        updateUI();
    }

    function processChoice(opt) {
        if (opt.triggerFire) {
            player.isFired = true;
            player.firedReason = opt.fireReason;
            endGame(false);
            return;
        }

        if (opt.action === "cureHabit") {
            if (player.badHabit === "smoke") player.stats.stamina += 5;
            if (player.badHabit === "betel") player.stats.stamina += 8;
            player.badHabit = null;
        }

        let changeLogs = [];
        let isMajorPunished = false;

        if (opt.changes) {
            for (let key in opt.changes) {
                player.stats[key] += opt.changes[key];
                let nameMap = { stamina: "體能", route: "路線", management: "向上管理", smart: "處事應變", relationship: "人緣" };
                let valStr = opt.changes[key] > 0 ? `+${opt.changes[key]}` : `${opt.changes[key]}`;
                changeLogs.push(`${nameMap[key]} ${valStr}`);
                
                if (opt.changes[key] <= -3) {
                    isMajorPunished = true;
                }
            }
        }

        if (opt.addPoints && opt.addPoints > 0) {
            player.points += opt.addPoints;
            changeLogs.push(`獲得額外點數 +${opt.addPoints}`);
        }

        let currentMonthly = salaryTable[player.salaryGrade] || 36250;
        let yearlyIncome = 0;
        let extraHabitCost = 0;

        if (player.badHabit === "smoke") extraHabitCost += 36000;
        if (player.badHabit === "betel") extraHabitCost += 60000;

        if (isMajorPunished) {
            yearlyIncome = currentMonthly * 12;
            changeLogs.push(`⚠️ 當年遭記大過懲處（考績丙等）：【不予晉薪】，當年年終與考績獎金全額泡湯！`);
        } else {
            yearlyIncome = Math.floor(currentMonthly * 16.5);
            
            if (player.role === "郵務稽查") {
                yearlyIncome += 3000;
                changeLogs.push(`郵務稽查年金加給 +$3,000`);
            }

            if (opt.grade) {
                player.gradeA++;
                changeLogs.push(`獲得考績甲等`);
            }

            if (player.salaryGrade > 36) {
                player.salaryGrade--;
                changeLogs.push(`薪級升至第 ${player.salaryGrade} 級`);
            } else {
                changeLogs.push(`已達專二碰頂最高薪級 (第 36 級)`);
            }
        }

        // 扣除基本生活費用 15 萬元與不良嗜好開銷後計入淨資產
        let netYearlyIncome = yearlyIncome - 150000 - extraHabitCost;
        player.totalEarnings += netYearlyIncome;
        
        changeLogs.push(`今年實領總年薪：$${yearlyIncome.toLocaleString()} | 扣除基本生活費15萬${extraHabitCost > 0 ? '與嗜好開銷' : ''}後淨存：$${netYearlyIncome.toLocaleString()}`);

        player.delivered += Math.floor(player.stats.route * 1200 + 8000);

        let logText = `📢 <b>【選擇結果】</b><br>${opt.result}<br><br><b>📈 結算：</b> ${changeLogs.join(" | ")}`;
        document.getElementById("choices-container").innerHTML = "";
        document.getElementById("log-container").innerHTML = `<div class="log-box">${logText}</div>`;

        player.age++;
        
        let mainBtn = document.getElementById("btn-main");
        mainBtn.classList.remove("hidden");
        updateUI();
    }

    function applyJob(targetJob) {
        let score = 0;
        if (targetJob === "白天接送收攬") score = player.stats.route * 2 + player.stats.stamina * 1.5;
        else if (targetJob === "半夜接送收攬") score = player.stats.stamina * 2 + player.stats.smart * 1.5;
        else if (targetJob === "郵務稽查") score = player.stats.management * 2 + player.stats.relationship * 1.5;

        let rivalScore = Math.floor(Math.random() * 30) + 35;

        if (score >= rivalScore) {
            player.role = targetJob;
            alert(`🎉 競爭成功！你成功獲得新職位：【${targetJob}】！`);
        } else {
            alert(`❌ 競爭失敗！資力與關鍵屬性還不夠高，請繼續努力！`);
        }
        updateUI();
    }

    function takeExam() {
        player.examPassed = true;
        if (Math.random() < 0.7) {
            alert("🎉 恭喜通過升遷大考轉任內勤！邁向冷氣房人生～");
            endGame(true);
        } else {
            player.role = "外勤郵務員（內勤適應不良重回外勤）";
            alert("⚠️ 轉任內勤後適應不良，申請退貨重回外勤！");
            updateUI();
        }
    }

    function endGame(isOfficeWin = false) {
        document.getElementById("game-page").classList.add("hidden");
        document.getElementById("result-page").classList.remove("hidden");

        let codeNameMap = { "A": "【天賦 A：路線敏銳】", "B": "【天賦 B：靈敏應變】", "C": "【天賦 C：鋼鐵體魄】" };
        let finalTitle = "【堅守崗位郵務員】";
        
        if (player.isFired) {
            document.getElementById("result-header").innerText = "⚠️ 職場解職/失能通知書";
            finalTitle = "🚨【因故遭免職或失能退場】";
        } else if (isOfficeWin) {
            document.getElementById("result-header").innerText = "🎉 順利轉內勤．遊戲圓滿通關！";
            finalTitle = "【冷氣房辦公室大師．成功上岸】";
        } else if (player.role === "郵務稽查") {
            finalTitle = "【掌權巡查者．郵務稽查大師】";
        } else if (player.role === "半夜接送收攬") {
            finalTitle = "【夜行傳說．大宗月台殺手】";
        } else if (player.role === "白天接送收攬") {
            finalTitle = "【城市穿梭機．高效收攬王】";
        }

        let finalSalary = salaryTable[player.salaryGrade] || 36250;

        document.getElementById("summary-content").innerHTML = `
            <b>姓名：</b> ${player.name}<br>
            <b>背景經歷：</b> 曾任「${player.oldJob}」，心路歷程：${player.whyPost}<br>
            <b>入職起始年齡：</b> ${player.startAge} 歲 (${player.section})<br>
            <b>揭曉天賦：</b> <span style="color:#0288d1; font-weight:bold;">${codeNameMap[player.code]}</span><br>
            <b>生涯稱號：</b> <span style="font-size:18px; color:#d32f2f; font-weight:bold;">${finalTitle}</span><br>
            ${player.isFired ? `<br><b>離職原因：</b> <span style="color:red;">${player.firedReason}</span><br>` : ''}
            <hr>
            💰 <b>生涯財務總結 (已扣除每年15萬元基本生活費)：</b><br>
            - 生涯累積淨資產：<b style="font-size:18px; color:#2e7d32;">$${player.totalEarnings.toLocaleString()} 元</b><br>
            - 退休前最終薪級：<b>第 ${player.salaryGrade} 級</b> ($${finalSalary.toLocaleString()}/月)<br>
            <hr>
            📊 <b>最終能力值：</b><br>
            體能: ${player.stats.stamina} | 熟練: ${player.stats.route} | 向上管理: ${player.stats.management} | 應變: ${player.stats.smart} | 人緣: ${player.stats.relationship}<br>
            <hr>
            📮 <b>生涯處理郵件總數：</b> ${player.delivered.toLocaleString()} 件<br>
            🏆 <b>獲得考績甲等：</b> ${player.gradeA} 次<br>
        `;
    }
</script>
</body>
</html>
