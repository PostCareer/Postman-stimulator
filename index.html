<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郵務人生模擬器 Postman Life Simulator</title>
    <style>
        :root {
            --green-main: #008751;
            --green-dark: #005c37;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 20px;
        }
        h1 {
            color: var(--green-main);
            text-align: center;
            margin-top: 0;
            font-size: 24px;
        }
        .status-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #e8f5e9;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
        .status-item span {
            display: block;
            font-weight: bold;
            font-size: 16px;
            color: var(--green-dark);
        }
        .event-box {
            min-height: 180px;
            background: #fafafa;
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 15px;
            line-height: 1.6;
        }
        .event-log {
            color: #555;
            margin-bottom: 8px;
        }
        .event-highlight {
            font-weight: bold;
            color: var(--green-dark);
        }
        button {
            width: 100%;
            background-color: var(--green-main);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--green-dark); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .setup-group {
            margin-bottom: 15px;
        }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .hidden { display: none; }
        .summary-card {
            background: #fff8e1;
            border: 1px solid #ffe082;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📮 郵務人生模擬器</h1>

    <!-- 階段 1：角色設定 -->
    <div id="setup-page">
        <div class="setup-group">
            <label for="player-name">郵務士姓名：</label>
            <input type="text" id="player-name" placeholder="請輸入姓名" value="郵小弟">
        </div>
        <div class="setup-group">
            <label for="player-trait">天賦選擇：</label>
            <select id="player-trait">
                <option value="dog">🐕 狗語者（遇犬攻擊率大幅降低）</option>
                <option value="stamina">⚡ 腿力爆發（體力上限更高）</option>
                <option value="smart">📚 考霸基因（內部升遷考試成功率上升）</option>
            </select>
        </div>
        <button onclick="startGame()">踏上郵務人生！</button>
    </div>

    <!-- 階段 2：主遊戲畫面 -->
    <div id="game-page" class="hidden">
        <div class="status-bar">
            <div class="status-item">年齡/身份<span id="stat-age">18歲 (外勤)</span></div>
            <div class="status-item">體力<span id="stat-hp">100 / 100</span></div>
            <div class="status-item">考績累積<span id="stat-eval">甲等: 0 次</span></div>
        </div>

        <div class="event-box" id="event-box">
            點擊下方按鈕開始你的第一年郵務生涯！
        </div>

        <button id="btn-next" onclick="nextYear()">下一年 (推進人生)</button>
        <button id="btn-exam" onclick="takeExam()" style="background-color: #0288d1;">📝 參加內部升遷考試 (轉內勤)</button>
    </div>

    <!-- 階段 3：退休結算 -->
    <div id="result-page" class="hidden">
        <h2>🏆 郵務生涯榮退報告</h2>
        <div class="summary-card" id="summary-content"></div>
        <br>
        <button onclick="location.reload()">重新體驗新人生</button>
    </div>
</div>

<script>
    let player = {
        name: "",
        trait: "",
        age: 18,
        role: "外勤郵務員", // 外勤 / 內勤
        hp: 100,
        maxHp: 100,
        delivered: 0,
        dogsEncountered: 0,
        dogBites: 0,
        gradeA: 0,
        examPassed: false,
        isRetired: false
    };

    function startGame() {
        player.name = document.getElementById("player-name").value || "無名郵務士";
        player.trait = document.getElementById("player-trait").value;
        
        if (player.trait === "stamina") {
            player.maxHp = 130;
            player.hp = 130;
        }

        document.getElementById("setup-page").classList.add("hidden");
        document.getElementById("game-page").classList.remove("hidden");
        updateStatus();
        document.getElementById("event-box").innerHTML = `<b>${player.name}</b> 正式進入中華郵政服役！開始了你的郵務職涯。`;
    }

    function updateStatus() {
        document.getElementById("stat-age").innerText = `${player.age}歲 (${player.role})`;
        document.getElementById("stat-hp").innerText = `${player.hp} / ${player.maxHp}`;
        document.getElementById("stat-eval").innerText = `甲等: ${player.gradeA} 次`;
    }

    function nextYear() {
        if (player.age >= 65) {
            endGame();
            return;
        }

        player.age++;
        let logs = [];
        logs.push(`<b>📅 【${player.age} 歲】</b>`);

        // 郵件量計算
        let currentDelivered = player.role === "外勤郵務員" ? Math.floor(Math.random() * 8000 + 12000) : Math.floor(Math.random() * 3000 + 5000);
        player.delivered += currentDelivered;

        // 隨機事件 (外勤特有)
        if (player.role === "外勤郵務員") {
            // 遇犬事件
            let dogOdds = player.trait === "dog" ? 0.15 : 0.4;
            if (Math.random() < dogOdds) {
                player.dogsEncountered++;
                if (Math.random() < 0.3 && player.trait !== "dog") {
                    player.dogBites++;
                    player.hp -= 15;
                    logs.push(`🐕 <span style="color:red;">遇到巷口黑狗突襲！不小心被咬傷，體力-15。</span>`);
                } else {
                    logs.push(`🐕 遇上吠叫的小狗，憑藉老練經驗成功甩開！`);
                }
            }

            // 天氣事件
            if (Math.random() < 0.25) {
                logs.push(`🌧️ 遇到颱風與連續暴雨，冒雨送件非常辛苦，體力-10。`);
                player.hp -= 10;
            }
        } else {
            // 內勤特有事件
            if (Math.random() < 0.2) {
                logs.push(`🏢 窗口遇到情緒激動的民眾，耐心溝通後順利解決，滿意度上升。`);
            }
        }

        // 考績評比
        let gradeOdds = 0.5 + (player.trait === "smart" ? 0.15 : 0);
        if (Math.random() < gradeOdds) {
            player.gradeA++;
            logs.push(`🌟 本年度表現優異，考績榮獲 <b style="color:#008751;">甲等</b>！`);
        } else {
            logs.push(`📦 今年平穩過關，考績獲得 乙等。`);
        }

        // 體力恢復與扣除
        player.hp = Math.min(player.maxHp, player.hp + 5);
        if (player.hp <= 0) player.hp = 10; // 保底

        updateStatus();
        document.getElementById("event-box").innerHTML = logs.join("<br>");

        if (player.age === 65) {
            document.getElementById("btn-next").innerText = "領取榮退紀念 (觀看結算)";
        }
    }

    function takeExam() {
        if (player.examPassed) {
            alert("你已經通過升遷考試並擔任內勤囉！");
            return;
        }

        let successRate = player.trait === "smart" ? 0.7 : 0.4;
        if (Math.random() < successRate) {
            player.examPassed = true;
            player.role = "內勤郵務士";
            document.getElementById("btn-exam").disabled = true;
            document.getElementById("btn-exam").innerText = "✅ 已轉為內勤職";
            alert("🎉 恭喜！你成功通過內部升遷考試，轉任內勤職務！");
            updateStatus();
        } else {
            alert("❌ 很可惜，今年的內部升遷考試差了一點點，明年再接再厲！");
        }
    }

    function endGame() {
        document.getElementById("game-page").classList.add("hidden");
        document.getElementById("result-page").classList.remove("hidden");

        let title = "【平凡堅守的郵務老兵】";
        if (player.gradeA >= 25) title = "【郵政傳奇標竿】";
        if (player.dogBites === 0 && player.dogsEncountered > 5) title = "【馴狗大師郵務士】";
        if (player.examPassed && player.gradeA >= 20) title = "【卓越內務主管】";

        let html = `
            <b>姓名：</b> ${player.name}<br>
            <b>終極稱號：</b> <span style="font-size:18px; color:#008751; font-weight:bold;">${title}</span><br>
            <hr>
            📮 <b>生涯總投遞/處理件數：</b> ${player.delivered.toLocaleString()} 件<br>
            🏆 <b>累計考績甲等：</b> ${player.gradeA} 次<br>
            🐕 <b>遭遇猛犬次數：</b> ${player.dogsEncountered} 次 (被咬 ${player.dogBites} 次)<br>
            💼 <b>最終職務：</b> ${player.role}<br>
            <hr>
            <b>職涯評語：</b> 感謝你為郵務事業奉獻 47 年的光陰，祝你退休生活愉快！
        `;
        document.getElementById("summary-content").innerHTML = html;
    }
</script>
</body>
</html>
