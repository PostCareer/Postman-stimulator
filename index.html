<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郵務人生模擬器 V3.1</title>
    <style>
        :root {
            --green-main: #008751;
            --green-dark: #005c37;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 15px; color: #333;
        }
        .container {
            max-width: 600px; margin: 0 auto; background: var(--card-bg);
            border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 20px;
        }
        h1 { color: var(--green-main); text-align: center; margin-top: 0; font-size: 22px; }
        
        .status-bar {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
            background: #e8f5e9; padding: 10px; border-radius: 10px; margin-bottom: 12px;
            text-align: center; font-size: 13px;
        }
        .status-item span { display: block; font-weight: bold; font-size: 15px; color: var(--green-dark); }

        .stats-panel {
            background: #f1f8e9; border: 1px solid #c8e6c9; border-radius: 10px;
            padding: 12px; margin-bottom: 15px;
        }
        .stats-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 14px; }
        .btn-add {
            background: var(--green-main); color: white; border: none;
            border-radius: 5px; padding: 2px 10px; font-weight: bold; cursor: pointer;
        }
        .btn-add:disabled { background: #ccc; }

        .event-card {
            background: #fafafa; border: 2px solid #e0e0e0; border-radius: 12px;
            padding: 15px; margin-bottom: 15px; min-height: 90px;
        }
        .event-title { font-size: 16px; font-weight: bold; color: #1a237e; margin-bottom: 8px; }
        .event-desc { font-size: 14px; line-height: 1.5; color: #424242; }

        .choices-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .btn-choice {
            width: 100%; background: #fff; color: #333; border: 2px solid var(--green-main);
            padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px;
            cursor: pointer; text-align: left; transition: all 0.2s;
        }
        .btn-choice:hover { background: var(--green-main); color: white; }

        .btn-action {
            width: 100%; background-color: var(--green-main); color: white; border: none;
            padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        .btn-exam { background-color: #0288d1; margin-top: 8px; }
        .btn-exam:disabled { background-color: #b0bec5; cursor: not-allowed; }

        .setup-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
        input, select {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;
            box-sizing: border-box; font-size: 14px;
        }
        .hidden { display: none; }
        .log-box {
            background: #fffde7; border-left: 4px solid #fbc02d; padding: 10px;
            margin-top: 10px; font-size: 13px; border-radius: 4px; line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📮 郵務人生模擬器 V3.1</h1>

    <!-- 階段 1：角色與代號選擇 -->
    <div id="setup-page">
        <div class="setup-group">
            <label for="player-name">郵務士姓名：</label>
            <input type="text" id="player-name" value="郵小弟">
        </div>
        <div class="setup-group">
            <label for="player-code">選擇人生代號（初始路線與能力）：</label>
            <select id="player-code">
                <option value="A">【代號 A：巷弄傳奇】高熟練/高抗犬，專精外勤極速送件</option>
                <option value="B">【代號 B：管理之星】高應變，容易通過內部升遷考試轉內勤</option>
                <option value="C">【代號 C：鐵人郵務士】高體力，抗天氣災害與極端勤務</option>
            </select>
        </div>
        <button class="btn-action" onclick="startGame()">開啟代號生涯！</button>
    </div>

    <!-- 階段 2：主遊戲畫面 -->
    <div id="game-page" class="hidden">
        <div class="status-bar">
            <div class="status-item">年齡/職務<span id="stat-age">18歲</span></div>
            <div class="status-item">路線類型<span id="stat-code">代號 A</span></div>
            <div class="status-item">考績甲等<span id="stat-eval">0 次</span></div>
        </div>

        <!-- 屬性點數加點面板 -->
        <div class="stats-panel">
            <div class="stats-header">
                <span>📊 屬性能力值 (上限 20)</span>
                <span style="color:#d32f2f;">可分配點數：<span id="stat-points">0</span></span>
            </div>
            <div class="stat-row">
                <span>⚡ 體能強度：<b id="val-stamina">10</b>/20</span>
                <button class="btn-add" id="btn-add-stamina" onclick="addPoint('stamina')">+1</button>
            </div>
            <div class="stat-row">
                <span>🗺️ 路線熟練度：<b id="val-route">10</b>/20</span>
                <button class="btn-add" id="btn-add-route" onclick="addPoint('route')">+1</button>
            </div>
            <div class="stat-row">
                <span>🐕 抗犬與防護：<b id="val-dog">10</b>/20</span>
                <button class="btn-add" id="btn-add-dog" onclick="addPoint('dog')">+1</button>
            </div>
            <div class="stat-row">
                <span>📚 處事與應變：<b id="val-smart">10</b>/20</span>
                <button class="btn-add" id="btn-add-smart" onclick="addPoint('smart')">+1</button>
            </div>
        </div>

        <div class="event-card">
            <div class="event-title" id="event-title">準備出勤</div>
            <div class="event-desc" id="event-desc">點擊下方按鈕開始進行今年的業務！</div>
            <div id="log-container"></div>
        </div>

        <div class="choices-container" id="choices-container"></div>

        <button id="btn-main" class="btn-action" onclick="startYear()">進行今年業務</button>
        <button id="btn-exam" class="btn-action btn-exam" onclick="takeExam()">🔒 升遷考試（須任職滿 3 年）</button>
    </div>

    <!-- 階段 3：退休結算 -->
    <div id="result-page" class="hidden">
        <h2>🏆 郵務生涯榮退報告</h2>
        <div id="summary-content" style="line-height: 1.8; background:#fff8e1; padding:15px; border-radius:10px;"></div>
        <br>
        <button class="btn-action" onclick="location.reload()">重新體驗新代號</button>
    </div>
</div>

<script>
    let player = {
        name: "", code: "A", age: 18, role: "外勤郵務員",
        points: 3,
        stats: { stamina: 10, route: 10, dog: 10, smart: 10 },
        delivered: 0, gradeA: 0,
        examPassed: false
    };

    const MAX_STAT = 20;

    function startGame() {
        player.name = document.getElementById("player-name").value || "郵小弟";
        player.code = document.getElementById("player-code").value;

        if (player.code === "A") { player.stats.route = 14; player.stats.dog = 13; }
        if (player.code === "B") { player.stats.smart = 14; player.stats.route = 12; }
        if (player.code === "C") { player.stats.stamina = 15; player.stats.dog = 12; }

        document.getElementById("setup-page").classList.add("hidden");
        document.getElementById("game-page").classList.remove("hidden");
        updateUI();
    }

    function updateUI() {
        document.getElementById("stat-age").innerText = `${player.age}歲 (${player.role})`;
        document.getElementById("stat-code").innerText = `代號 ${player.code}`;
        document.getElementById("stat-eval").innerText = `${player.gradeA} 次`;
        document.getElementById("stat-points").innerText = player.points;

        for (let key in player.stats) {
            // 限制最大值不超過 20，不小於 1
            if (player.stats[key] > MAX_STAT) player.stats[key] = MAX_STAT;
            if (player.stats[key] < 1) player.stats[key] = 1;
            
            document.getElementById(`val-${key}`).innerText = player.stats[key];
            document.getElementById(`btn-add-${key}`).disabled = (player.points <= 0 || player.stats[key] >= MAX_STAT);
        }

        // 升遷考試按鈕邏輯：任職滿 3 年（21 歲）才開放
        let examBtn = document.getElementById("btn-exam");
        if (player.examPassed) {
            examBtn.disabled = true;
            examBtn.innerText = "✅ 已轉為內勤人員";
        } else if (player.age < 21) {
            examBtn.disabled = true;
            examBtn.innerText = `🔒 升遷考試（須任職滿 3 年，還差 ${21 - player.age} 年）`;
        } else {
            examBtn.disabled = false;
            examBtn.innerText = "📝 參加內部升遷考試";
        }
    }

    function addPoint(statKey) {
        if (player.points > 0 && player.stats[statKey] < MAX_STAT) {
            player.stats[statKey]++;
            player.points--;
            updateUI();
        }
    }

    // 事件庫：提供 3 種選擇，各帶來不同的屬性增減或點數獲得
    const eventPool = [
        {
            title: "📦 大宗掛號專案投遞",
            desc: "今天有整整兩箱商業掛號信件需要全部當天送到！",
            options: [
                {
                    text: "⚡ 咬牙硬衝！憑體力一口氣送完",
                    result: "信件全部送達！但身體消耗極大。",
                    changes: { stamina: -1, route: 1 },
                    addPoints: 0, grade: true
                },
                {
                    text: "🗺️ 重新排信！運用路線優化順序",
                    result: "順利完成！你對區段路線有了更深的領悟。",
                    changes: { route: 2 },
                    addPoints: 1, grade: true
                },
                {
                    text: "🤝 請託同仁協助分擔，展現處事情商",
                    result: "成功化解危機，與同事關係升溫，學會了人際溝通。",
                    changes: { smart: 1 },
                    addPoints: 1, grade: false
                }
            ]
        },
        {
            title: "🐕 巷弄遭遇未繫繩狂犬",
            desc: "進入狹窄巷弄時，一隻猛犬突然跳出來衝著你大吠！",
            options: [
                {
                    text: "🛡️ 使用防身裝備與冷靜對峙退後",
                    result: "冷靜成功化解危機，累積了極佳的防狗經驗！",
                    changes: { dog: 2 },
                    addPoints: 1, grade: true
                },
                {
                    text: "💨 展現驚人敏捷！騎車加速甩開暴躁狗",
                    result: "成功逃脫！體能得到鍛鍊，但路線稍微跑偏了一點。",
                    changes: { stamina: 1, route: -1 },
                    addPoints: 0, grade: false
                },
                {
                    text: "🗣️ 與附近屋主協調，柔性請對方繫犬",
                    result: "成功讓住戶把狗繫上，改善了整條巷弄的投遞環境！",
                    changes: { smart: 1, dog: 1 },
                    addPoints: 1, grade: true
                }
            ]
        },
        {
            title: "⛈️ 颱風天豪雨強行出勤",
            desc: "豪雨特報發布，路上淹水且信件極易濕損！",
            options: [
                {
                    text: "☔ 包裹防護做到極致，維護信件安全",
                    result: "信件完好無損，獲得民眾大力表揚！",
                    changes: { smart: 1 },
                    addPoints: 1, grade: true
                },
                {
                    text: "🚴 涉水前行！拼死完成責任區投遞",
                    result: "展現郵務士鋼鐵意志，體能與意志力大幅提升！",
                    changes: { stamina: 2 },
                    addPoints: 0, grade: true
                },
                {
                    text: "☕ 暫時躲雨觀望，尋找雨勢變小的最佳時間點",
                    result: "雖然耽擱了一點時間，但保全了體力與信件安全。",
                    changes: { stamina: 1, smart: 1 },
                    addPoints: 0, grade: false
                }
            ]
        }
    ];

    function startYear() {
        if (player.age >= 65) { endGame(); return; }

        document.getElementById("btn-main").classList.add("hidden");
        document.getElementById("log-container").innerHTML = "";

        // 每年固定成長：獲得 1 點自由點數
        player.points += 1;
        updateUI();

        let evt = eventPool[Math.floor(Math.random() * eventPool.length)];
        document.getElementById("event-title").innerText = `📅 【${player.age} 歲】 ${evt.title}`;
        document.getElementById("event-desc").innerText = evt.desc;

        let container = document.getElementById("choices-container");
        container.innerHTML = "";
        evt.options.forEach((opt) => {
            let btn = document.createElement("button");
            btn.className = "btn-choice";
            btn.innerText = opt.text;
            btn.onclick = () => processChoice(opt);
            container.appendChild(btn);
        });
    }

    function processChoice(opt) {
        let changeLogs = [];

        // 1. 套用能力值增減
        if (opt.changes) {
            for (let key in opt.changes) {
                player.stats[key] += opt.changes[key];
                let nameMap = { stamina: "體能", route: "路線", dog: "抗犬", smart: "處事" };
                let valStr = opt.changes[key] > 0 ? `+${opt.changes[key]}` : `${opt.changes[key]}`;
                changeLogs.push(`${nameMap[key]} ${valStr}`);
            }
        }

        // 2. 獲得點數
        if (opt.addPoints > 0) {
            player.points += opt.addPoints;
            changeLogs.push(`獲得自由點數 +${opt.addPoints}`);
        }

        // 3. 考績判定
        if (opt.grade) {
            player.gradeA++;
            changeLogs.push(`獲得考績甲等`);
        }

        player.delivered += Math.floor(player.stats.route * 1200 + 8000);

        // 顯示結果面板
        let logText = `📢 <b>【選擇結果】</b><br>${opt.result}<br><br><b>📈 影響結果：</b> ${changeLogs.join(" | ")}`;
        document.getElementById("choices-container").innerHTML = "";
        document.getElementById("log-container").innerHTML = `<div class="log-box">${logText}</div>`;

        player.age++;
        updateUI();

        let mainBtn = document.getElementById("btn-main");
        mainBtn.classList.remove("hidden");
        mainBtn.innerText = player.age >= 65 ? "觀看榮退報告" : "推進到下一年";
    }

    function takeExam() {
        if (player.examPassed || player.age < 21) return;
        
        let rate = 0.3 + (player.stats.smart * 0.03);
        if (Math.random() < rate) {
            player.examPassed = true; player.role = "內勤郵務士";
            alert("🎉 恭喜！你順利考取內部升遷，轉為內勤職務！");
            updateUI();
        } else {
            alert(`❌ 考試未通過 (目前成功率: ${Math.round(rate*100)}%)，建議繼續提升「處事應變」能力！`);
        }
    }

    function endGame() {
        document.getElementById("game-page").classList.add("hidden");
        document.getElementById("result-page").classList.remove("hidden");

        let title = "【堅守崗位郵務員】";
        if (player.stats.route >= 18) title = "【活地圖巷弄傳奇】";
        if (player.stats.smart >= 18 && player.examPassed) title = "【郵政卓越高階主管】";
        if (player.stats.stamina >= 18) title = "【不屈鐵人郵務士】";

        document.getElementById("summary-content").innerHTML = `
            <b>姓名：</b> ${player.name} (代號 ${player.code})<br>
            <b>最終稱號：</b> <span style="font-size:18px; color:#008751; font-weight:bold;">${title}</span><br>
            <hr>
            📊 <b>最終能力總結：</b><br>
            - 體能: ${player.stats.stamina} / 熟練: ${player.stats.route} / 抗犬: ${player.stats.dog} / 應變: ${player.stats.smart}<br>
            <hr>
            📮 <b>生涯處理郵件總數：</b> ${player.delivered.toLocaleString()} 件<br>
            🏆 <b>獲得考績甲等：</b> ${player.gradeA} 次<br>
            💼 <b>退休身分：</b> ${player.role}<br>
        `;
    }
</script>
</body>
</html>
