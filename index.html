<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>郵差人生模擬器 V12.0</title>

<style>
:root {
    --green: #008751;
    --dark-green: #005c37;
    --light-green: #e8f5e9;
    --blue: #1976d2;
    --orange: #ef6c00;
    --red: #d32f2f;
    --bg: #f3f5f7;
    --card: #ffffff;
    --text: #333;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft JhengHei",
        sans-serif;
}

.container {
    max-width: 760px;
    margin: auto;
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 5px 25px rgba(0,0,0,.1);
}

h1 {
    color: var(--green);
    text-align: center;
    margin-top: 0;
}

h2 {
    text-align: center;
}

.hidden {
    display: none !important;
}

/* =========================
   開局
========================= */

.setup-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
}

/* =========================
   狀態欄
========================= */

.status-bar {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.status-item {
    background: var(--light-green);
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    font-size: 12px;
}

.status-item span {
    display: block;
    font-size: 15px;
    font-weight: bold;
    color: var(--dark-green);
    margin-top: 4px;
}

/* =========================
   職業卡
========================= */

.role-card {
    background: linear-gradient(135deg, #008751, #005c37);
    color: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.role-card h3 {
    margin: 0 0 5px 0;
}

.role-card p {
    margin: 0;
    font-size: 13px;
}

/* =========================
   屬性
========================= */

.stats-panel {
    background: #f8fbf8;
    border: 1px solid #d8e8d8;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 15px;
}

.stats-header {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    margin-bottom: 10px;
}

.stat-row {
    display: grid;
    grid-template-columns: 130px 1fr 45px;
    align-items: center;
    gap: 8px;
    margin-bottom: 9px;
    font-size: 13px;
}

.stat-bar {
    height: 10px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
}

.stat-fill {
    height: 100%;
    background: var(--green);
    transition: width .3s;
}

.btn-add {
    border: none;
    border-radius: 6px;
    padding: 5px;
    color: white;
    background: var(--green);
    cursor: pointer;
}

.btn-add:disabled {
    background: #bbb;
}

/* =========================
   年度流程
========================= */

.year-progress {
    margin-bottom: 15px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 5px;
}

.progress-bar {
    height: 12px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: var(--blue);
    transition: width .4s;
}

/* =========================
   事件
========================= */

.event-card {
    border: 2px solid #e5e5e5;
    border-radius: 14px;
    padding: 18px;
    min-height: 180px;
    margin-bottom: 15px;
}

.event-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #1a237e;
}

.event-desc {
    line-height: 1.7;
    font-size: 14px;
    white-space: pre-line;
}

.choice-container {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.btn-choice {
    width: 100%;
    text-align: left;
    padding: 13px;
    border: 2px solid var(--green);
    border-radius: 10px;
    background: white;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: .2s;
}

.btn-choice:hover {
    background: var(--green);
    color: white;
}

.result-box {
    margin-top: 15px;
    padding: 12px;
    background: #fffde7;
    border-left: 4px solid #fbc02d;
    border-radius: 5px;
    line-height: 1.6;
    font-size: 14px;
}

/* =========================
   按鈕
========================= */

.btn-main {
    width: 100%;
    border: none;
    padding: 14px;
    background: var(--green);
    color: white;
    font-size: 16px;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 10px;
}

.btn-main:hover {
    opacity: .9;
}

.btn-blue {
    background: var(--blue);
}

.btn-orange {
    background: var(--orange);
}

.btn-red {
    background: var(--red);
}

/* =========================
   職涯機會
========================= */

.opportunity-box {
    background: #fff3e0;
    border: 1px solid #ffcc80;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
}

.opportunity-box h3 {
    margin-top: 0;
    color: var(--orange);
}

.opportunity-text {
    line-height: 1.6;
    margin-bottom: 10px;
}

/* =========================
   年度紀錄
========================= */

.history-box {
    background: #fafafa;
    border-radius: 12px;
    padding: 15px;
    margin-top: 15px;
}

.history-item {
    border-bottom: 1px solid #ddd;
    padding: 9px 0;
    font-size: 13px;
}

.history-item:last-child {
    border: none;
}

/* =========================
   結局
========================= */

.result-card {
    background: #fff8e1;
    border-radius: 15px;
    padding: 20px;
    line-height: 1.8;
}

.ending-title {
    font-size: 25px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 15px;
}

/* =========================
   手機
========================= */

@media (max-width: 600px) {

    body {
        padding: 8px;
    }

    .container {
        padding: 15px;
    }

    .stat-row {
        grid-template-columns: 105px 1fr 38px;
        font-size: 12px;
    }

}

</style>
</head>

<body>

<div class="container">

<!-- =========================
     開局頁面
========================= -->

<div id="setupPage">

<h1>📮 郵差人生模擬器 V12.0</h1>

<p style="text-align:center;color:#666">
從菜鳥郵務員開始，看看你能不能平安撐到退休。
</p>

<div class="setup-group">

<label>你的名字</label>

<input
id="playerName"
type="text"
value="郵小弟">

</div>

<div class="setup-group">

<label>入職年齡</label>

<input
id="playerAge"
type="number"
value="25"
min="18"
max="50">

</div>

<div class="setup-group">

<label>進郵局前的職業</label>

<input
id="playerOldJob"
type="text"
value="民營物流司機">

</div>

<div class="setup-group">

<label>初始職務</label>

<select id="playerSection">

<option value="mixed">
📬 混投段
</option>

<option value="express">
📦 快捷包裹段
</option>

</select>

</div>

<div class="setup-group">

<label>天賦</label>

<select id="playerTalent">

<option value="route">
🗺️ 路線敏銳
（路線 +2、人緣 -2）
</option>

<option value="smart">
🧠 靈敏應變
（應變 +2、向上管理 -2）
</option>

<option value="stamina">
⚡ 鋼鐵體魄
（體能 +2、應變 -2）
</option>

<option value="social">
🤝 社交達人
（人緣 +2、體能 -2）
</option>

<option value="management">
👔 向上乖乖
（向上管理 +2、路線 -2）
</option>

</select>

</div>

<button
class="btn-main"
onclick="startGame()">

正式進局報到！

</button>

</div>

<!-- =========================
     遊戲頁面
========================= -->

<div
id="gamePage"
class="hidden">

<h1>📮 郵差人生模擬器</h1>

<div class="status-bar">

<div class="status-item">
年齡
<span id="ageText"></span>
</div>

<div class="status-item">
目前職務
<span id="roleText"></span>
</div>

<div class="status-item">
薪級 / 月薪
<span id="salaryText"></span>
</div>

<div class="status-item">
生涯資產
<span id="moneyText"></span>
</div>

</div>

<div class="role-card">

<h3 id="roleCardTitle"></h3>

<p id="roleCardDesc"></p>

</div>

<div class="stats-panel">

<div class="stats-header">

<span>📊 個人能力</span>

<span>
剩餘點數：
<span
id="pointsText"
style="color:#d32f2f">
0
</span>
</span>

</div>

<div id="statsContainer"></div>

</div>

<div class="year-progress">

<div class="progress-info">

<span id="yearProgressText">
年度開始
</span>

<span id="yearProgressNumber">
0 / 0
</span>

</div>

<div class="progress-bar">

<div
id="yearProgressFill"
class="progress-fill"
style="width:0%">
</div>

</div>

</div>

<div id="opportunityContainer"></div>

<div class="event-card">

<div
id="eventTitle"
class="event-title">

準備開始郵差人生

</div>

<div
id="eventDesc"
class="event-desc">

你的郵務生涯即將開始。

</div>

<div id="choiceContainer"></div>

<div id="resultContainer"></div>

</div>

<button
id="mainButton"
class="btn-main"
onclick="startYear()">

開始今年工作

</button>

<div class="history-box">

<b>📜 生涯紀錄</b>

<div id="historyContainer"></div>

</div>

</div>

<!-- =========================
     結局頁面
========================= -->

<div
id="endingPage"
class="hidden">

<div class="result-card">

<div
id="endingTitle"
class="ending-title">
</div>

<div id="endingContent"></div>

</div>

<br>

<button
class="btn-main"
onclick="location.reload()">

🔄 再次體驗郵差人生

</button>

</div>

</div>

<script>

/* =========================================================
   基本資料
========================================================= */

const salaryTable = {

55: 36250,
54: 37405,
53: 38640,
52: 39885,
51: 41130,
50: 42370,
49: 43600,
48: 44850,
47: 46090,
46: 47325,
45: 48560,
44: 49775,
43: 50470,
42: 51190,
41: 51890,
40: 52590,
39: 53290,
38: 53995,
37: 54695,
36: 55395

};

const roleInfo = {

"混投段": {
title: "📬 外勤郵務員・混投段",
desc: "平信、掛號、包裹全部都可能遇到。真正的郵差人生，從熟悉巷弄與應付各種民眾開始。"
},

"快捷包裹段": {
title: "📦 外勤郵務員・快捷包裹段",
desc: "包裹多、時間緊、體力消耗大。你的膝蓋與腰椎可能會比你先退休。"
},

"半夜收攬": {
title: "🌙 半夜接送收攬",
desc: "半夜上班、負責郵件接送與收攬。相較投遞工作較輕鬆，但你的作息可能會先崩潰。"
},

"白天收攬": {
title: "☀️ 白天接送收攬",
desc: "白天負責大宗郵件與合作廠商收攬，體力壓力較低，是許多外勤人員夢寐以求的職缺。"
},

"郵務稽查": {
title: "🔍 郵務稽查",
desc: "從投遞第一線轉為管理與稽核角色。你開始要處理民眾投訴、郵務事故與同仁問題。"
}

};


/* =========================================================
   玩家資料
========================================================= */

let player = {

name: "",
age: 25,
startAge: 25,

oldJob: "",

role: "",

salaryGrade: 55,

money: 0,

points: 5,

stats: {

stamina: 10,
route: 10,
management: 10,
smart: 10,
relationship: 10

},

gradeA: 0,

gradeB: 0,

careerEvents: 0,

history: [],

badHabit: null,

examPassed: false,

fired: false,

firedReason: "",

yearsWorked: 0,

yearEvents: [],

currentEventIndex: 0,

currentYear: 0,

yearIncome: 0,

specialCareerChance: null,

bigMistakes: 0,

helpedColleagues: 0,

complaints: 0

};


/* =========================================================
   屬性設定
========================================================= */

const statNames = {

stamina: "⚡ 體能強度",
route: "🗺️ 路線熟練",
management: "👔 向上管理",
smart: "🧠 處事應變",
relationship: "🤝 人緣社交"

};

const MIN_STAT = 1;
const MAX_STAT = 20;


/* =========================================================
   工具
========================================================= */

function randomItem(array) {

return array[
Math.floor(Math.random() * array.length)
];

}

function clampStats() {

for (let key in player.stats) {

if (player.stats[key] > MAX_STAT)
player.stats[key] = MAX_STAT;

if (player.stats[key] < MIN_STAT)
player.stats[key] = MIN_STAT;

}

}

function addHistory(text) {

player.history.unshift({

age: player.age,

text: text

});

if (player.history.length > 30) {

player.history.pop();

}

}

function modifyStats(changes) {

if (!changes) return;

for (let key in changes) {

player.stats[key] += changes[key];

}

clampStats();

}


/* =========================================================
   開始遊戲
========================================================= */

function startGame() {

const name =
document.getElementById("playerName").value.trim();

const age =
parseInt(
document.getElementById("playerAge").value
);

const oldJob =
document.getElementById("playerOldJob").value.trim();

const section =
document.getElementById("playerSection").value;

const talent =
document.getElementById("playerTalent").value;


if (!name) {

alert("至少幫自己取個名字吧🤣");

return;

}

if (!age || age < 18 || age > 50) {

alert("請輸入 18～50 歲之間的年齡！");

return;

}


player.name = name;

player.age = age;

player.startAge = age;

player.oldJob = oldJob || "社會新鮮人";

player.money = 0;

player.salaryGrade = 55;

player.points = 5;

player.gradeA = 0;

player.gradeB = 0;

player.careerEvents = 0;

player.history = [];

player.yearsWorked = 0;

player.fired = false;

player.examPassed = false;

player.badHabit = null;

player.bigMistakes = 0;

player.helpedColleagues = 0;

player.complaints = 0;

player.stats = {

stamina: 10,
route: 10,
management: 10,
smart: 10,
relationship: 10

};


/* 初始職務 */

if (section === "mixed") {

player.role = "混投段";

player.stats.route += 2;

} else {

player.role = "快捷包裹段";

player.stats.stamina += 2;

}


/* 天賦 */

if (talent === "route") {

player.stats.route += 2;

player.stats.relationship -= 2;

}

if (talent === "smart") {

player.stats.smart += 2;

player.stats.management -= 2;

}

if (talent === "stamina") {

player.stats.stamina += 2;

player.stats.smart -= 2;

}

if (talent === "social") {

player.stats.relationship += 2;

player.stats.stamina -= 2;

}

if (talent === "management") {

player.stats.management += 2;

player.stats.route -= 2;

}


clampStats();


document
.getElementById("setupPage")
.classList
.add("hidden");


document
.getElementById("gamePage")
.classList
.remove("hidden");


addHistory(
`🎉 ${player.name} 正式進入郵局，開始郵差人生！`
);


document.getElementById("eventTitle").innerText =
"🎊 正式報到！";


document.getElementById("eventDesc").innerText =

`${player.name}，你今年 ${player.age} 歲。

在「${player.oldJob}」工作一段時間後，你決定轉換跑道。

現在，你正式穿上郵局制服。

你的郵差人生，開始了。`;


updateUI();

}


/* =========================================================
   更新 UI
========================================================= */

function updateUI() {

player.yearsWorked =
player.age - player.startAge;


document.getElementById("ageText").innerText =
`${player.age} 歲`;

document.getElementById("roleText").innerText =
player.role;


const salary =
salaryTable[player.salaryGrade];


document.getElementById("salaryText").innerText =
`${player.salaryGrade} 級 / $${salary.toLocaleString()}`;


document.getElementById("moneyText").innerText =
`$${player.money.toLocaleString()}`;


document.getElementById("pointsText").innerText =
player.points;


/* 職務 */

const info = roleInfo[player.role];

document.getElementById("roleCardTitle").innerText =
info.title;

document.getElementById("roleCardDesc").innerText =
info.desc;


/* 屬性 */

const container =
document.getElementById("statsContainer");

container.innerHTML = "";


for (let key in player.stats) {

const value =
player.stats[key];

const percent =
(value / MAX_STAT) * 100;

const disabled =
player.points <= 0 || value >= MAX_STAT;

container.innerHTML += `

<div class="stat-row">

<div>
${statNames[key]} ${value}/20
</div>

<div class="stat-bar">

<div
class="stat-fill"
style="width:${percent}%">
</div>

</div>

<button
class="btn-add"
onclick="addPoint('${key}')"
${disabled ? "disabled" : ""}>

+1

</button>

</div>

`;

}


/* 歷史 */

const historyContainer =
document.getElementById("historyContainer");

historyContainer.innerHTML = "";

player.history.forEach(item => {

historyContainer.innerHTML += `

<div class="history-item">

<b>${item.age} 歲</b>
｜${item.text}

</div>

`;

});


updateCareerOpportunities();

}


/* =========================================================
   加點
========================================================= */

function addPoint(stat) {

if (player.points <= 0) return;

if (player.stats[stat] >= MAX_STAT) return;

player.stats[stat]++;

player.points--;

updateUI();

}


/* =========================================================
   職涯機會
========================================================= */

function updateCareerOpportunities() {

const container =
document.getElementById("opportunityContainer");

container.innerHTML = "";


/* 年度進行中不顯示 */

if (player.yearEvents.length > 0) return;

const years =
player.yearsWorked;


/* 內勤升遷考 */

if (
years >= 3 &&
years % 3 === 0 &&
!player.examPassed &&
player.role !== "郵務稽查"
) {

container.innerHTML += `

<div class="opportunity-box">

<h3>📝 內部升遷考試</h3>

<div class="opportunity-text">

總公司舉辦內部升遷考試。

如果成功考上內勤，
你的「郵差人生」將正式結束。

</div>

<button
class="btn-main btn-blue"
onclick="takeExam()">

我要拼內勤升遷！

</button>

</div>

`;

}


/* 半夜收攬 */

if (
years >= 5 &&
player.role !== "半夜收攬" &&
Math.random() < 0.22
) {

container.innerHTML += `

<div class="opportunity-box">

<h3>🌙 半夜接送收攬出缺</h3>

<div class="opportunity-text">

局內出現半夜接送收攬職缺。

這個工作相對投遞較輕鬆，
但必須適應日夜顛倒的生活。

</div>

<button
class="btn-main btn-orange"
onclick="changeRole('半夜收攬')">

競爭這個職缺

</button>

</div>

`;

}


/* 白天收攬 */

if (
years >= 8 &&
player.role !== "白天收攬" &&
Math.random() < 0.18
) {

container.innerHTML += `

<div class="opportunity-box">

<h3>☀️ 白天接送收攬出缺</h3>

<div class="opportunity-text">

白天接送收攬職缺出現。

不少外勤同仁都想競爭，
這可能是相對輕鬆的職涯選擇。

</div>

<button
class="btn-main btn-orange"
onclick="changeRole('白天收攬')">

競爭這個職缺

</button>

</div>

`;

}


/* 稽查 */

if (
years >= 10 &&
player.role !== "郵務稽查" &&
Math.random() < 0.15
) {

container.innerHTML += `

<div class="opportunity-box">

<h3>🔍 郵務稽查即將退休！</h3>

<div class="opportunity-text">

局內資深郵務稽查即將退休。

這個職缺競爭激烈。

你是否要投入競爭，
從第一線郵差轉型為郵務管理人員？

</div>

<button
class="btn-main btn-red"
onclick="competeInspector()">

我要競爭稽查！

</button>

</div>

`;

}

}


/* =========================================================
   轉職
========================================================= */

function changeRole(role) {

player.role = role;

addHistory(
`🎉 成功轉任「${role}」！`
);

document.getElementById("eventTitle").innerText =
"🎉 職涯轉換成功";

document.getElementById("eventDesc").innerText =
`恭喜你成功轉任 ${role}！

/* =========================================================
   年度開始
========================================================= */

function startYear() {

if (player.points > 0) {

alert("你還有能力點數沒分配完！");

return;

}


if (player.age >= 65) {

endGame("retirement");

return;

}


/* 每年 2～4 件事情 */

const eventCount =
Math.floor(Math.random() * 3) + 2;


player.yearEvents =
generateYearEvents(eventCount);


player.currentEventIndex = 0;


document
.getElementById("mainButton")
.classList
.add("hidden");


document
.getElementById("opportunityContainer")
.innerHTML = "";


showNextEvent();

}


/* =========================================================
   生成年度事件
========================================================= */

function generateYearEvents(count) {

let pool = [

...commonEvents

];


/* 菜鳥 */

if (player.yearsWorked < 3) {

pool.push(
...rookieEvents
);

}


/* 資深 */

if (player.age >= 50) {

pool.push(
...seniorEvents
);

}


/* 職務 */

if (roleEvents[player.role]) {

pool.push(
...roleEvents[player.role]
);

}


/* 隨機抽取 */

pool =
shuffleArray(pool);


return pool.slice(0, count);

}


function shuffleArray(array) {

return [...array]
.sort(() => Math.random() - 0.5);

}


/* =========================================================
   下一事件
========================================================= */

function showNextEvent() {

if (
player.currentEventIndex >=
player.yearEvents.length
) {

finishYear();

return;

}


const event =
player.yearEvents[
player.currentEventIndex
];


document.getElementById(
"eventTitle"
).innerText =

`【今年事件 ${
player.currentEventIndex + 1
}/${player.yearEvents.length}
】

${event.title}`;


document.getElementById(
"eventDesc"
).innerText = event.desc;


document.getElementById(
"resultContainer"
).innerHTML = "";


const choices =
document.getElementById(
"choiceContainer"
);


choices.innerHTML = "";


event.options.forEach(option => {

const button =
document.createElement("button");


button.className =
"btn-choice";


button.innerText =
option.text;


button.onclick = () =>
handleChoice(option);


choices.appendChild(button);

});


const progress =

((player.currentEventIndex) /
player.yearEvents.length)
* 100;


document.getElementById(
"yearProgressFill"
).style.width =
`${progress}%`;


document.getElementById(
"yearProgressNumber"
).innerText =

`${player.currentEventIndex + 1}
/
${player.yearEvents.length}`;


}


/* =========================================================
   處理選項
========================================================= */

function handleChoice(option) {

document.getElementById(
"choiceContainer"
).innerHTML = "";


/* 開除 */

if (option.fire) {

player.fired = true;

player.firedReason =
option.fireReason;

document.getElementById(
"resultContainer"
).innerHTML =

`<div class="result-box">

💥 ${option.result}

</div>`;


setTimeout(() => {

endGame("fired");

}, 1800);

return;

}


/* 屬性 */

modifyStats(
option.changes
);


/* 點數 */

if (option.points) {

player.points +=
option.points;

}


/* 考績 */

if (option.grade === "A") {

player.gradeA++;

}

if (option.grade === "B") {

player.gradeB++;

}


/* 特殊數值 */

if (option.helped) {

player.helpedColleagues++;

}

if (option.complaint) {

player.complaints++;

}

if (option.mistake) {

player.bigMistakes++;

}


/* 結果 */

document.getElementById(
"resultContainer"
).innerHTML =

`<div class="result-box">

💡 <b>事件結果：</b>

${option.result}

</div>`;


/* 下一個 */

setTimeout(() => {

player.currentEventIndex++;

showNextEvent();

}, 1500);

}


/* =========================================================
   年度結算
========================================================= */

function finishYear() {

const salary =
salaryTable[
player.salaryGrade
];


const annualSalary =
salary * 12;


/* 年終 */

let bonus =
salary * 1;


/* 考績加成 */

if (player.gradeA > 0) {

bonus += salary * 1;

}


/* 生活費 */

let expense = 180000;


/* 年齡增加生活費 */

if (player.age >= 45) {

expense += 20000;

}


const savings =
annualSalary +
bonus -
expense;


player.money += savings;


/* 升薪級 */

if (
player.salaryGrade > 36 &&
Math.random() < 0.75
) {

player.salaryGrade--;

}


/* 年度紀錄 */

addHistory(

`💰 年度結算：

收入 $${(annualSalary + bonus).toLocaleString()}

生活支出 $${expense.toLocaleString()}

今年累積資產
+$${savings.toLocaleString()}`

);


player.yearEvents = [];


/* 年齡 */

player.age++;


/* 年資 */

player.yearsWorked =
player.age -
player.startAge;


/* 每年獲得點數 */

player.points += 1;


/* 檢查能力 */

for (let key in player.stats) {

if (
player.stats[key] <= 1
) {

player.fired = true;

player.firedReason =
`${statNames[key]} 長期處於最低狀態，已無法繼續勝任郵務工作。`;

endGame("fired");

return;

}

}


/* 進度 */

document.getElementById(
"yearProgressFill"
).style.width =
"100%";


document.getElementById(
"yearProgressText"
).innerText =
"年度工作完成！";


document.getElementById(
"yearProgressNumber"
).innerText =
"完成";


document.getElementById(
"eventTitle"
).innerText =
"📅 年度工作結束";


document.getElementById(
"eventDesc"
).innerText =

`你完成了 ${player.age - 1} 歲這一年的工作。

年度存款：

$${savings.toLocaleString()}

明年，你將迎接新的郵務人生。`;


document
.getElementById("mainButton")
.classList
.remove("hidden");


document.getElementById(
"mainButton"
).innerText =
"開始下一年的郵務人生";


updateUI();

}

}

}
