<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郵務人生模擬器 V5.0</title>
    <style>
        :root {
            --green-main: #008751;
            --green-dark: #005c37;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 15px; color: #333;
        }
        .container {
            max-width: 600px; margin: 0 auto; background: var(--card-bg);
            border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 20px;
        }
        h1 { color: var(--green-main); text-align: center; margin-top: 0; font-size: 22px; }
        
        .status-bar {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
            background: #e8f5e9; padding: 10px; border-radius: 10px; margin-bottom: 12px;
            text-align: center; font-size: 13px;
        }
        .status-item span { display: block; font-weight: bold; font-size: 14px; color: var(--green-dark); }

        .salary-bar {
            background: #fff3e0; border: 1px solid #ffe0b2; border-radius: 10px;
            padding: 10px; margin-bottom: 12px; font-size: 13px; text-align: center;
        }
        .salary-bar span { font-weight: bold; color: #e65100; }

        .stats-panel {
            background: #f1f8e9; border: 1px solid #c8e6c9; border-radius: 10px;
            padding: 12px; margin-bottom: 15px;
        }
        .stats-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 14px; }
        .btn-add {
            background: var(--green-main); color: white; border: none;
            border-radius: 5px; padding: 2px 10px; font-weight: bold; cursor: pointer;
        }
        .btn-add:disabled { background: #ccc; }

        .event-card {
            background: #fafafa; border: 2px solid #e0e0e0; border-radius: 12px;
            padding: 15px; margin-bottom: 15px; min-height: 90px;
        }
        .event-title { font-size: 16px; font-weight: bold; color: #1a237e; margin-bottom: 8px; }
        .event-desc { font-size: 14px; line-height: 1.5; color: #424242; }

        .choices-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .btn-choice {
            width: 100%; background: #fff; color: #333; border: 2px solid var(--green-main);
            padding: 12px; font-size: 14px; font-weight: bold; border-radius: 8px;
            cursor: pointer; text-align: left; transition: all 0.2s;
        }
        .btn-choice:hover { background: var(--green-main); color: white; }

        .btn-action {
            width: 100%; background-color: var(--green-main); color: white; border: none;
            padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-bottom: 6px;
        }
        .btn-exam { background-color: #0288d1; }
        .btn-exam:disabled { background-color: #b0bec5; cursor: not-allowed; }
        .btn-role { background-color: #7b1fa2; }

        .setup-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
        input, select {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;
            box-sizing: border-box; font-size: 14px;
        }
        .hidden { display: none; }
        .log-box {
            background: #fffde7; border-left: 4px solid #fbc02d; padding: 10px;
            margin-top: 10px; font-size: 13px; border-radius: 4px; line-height: 1.5;
        }
        .modal {
            background: #e1f5fe; border: 2px solid #0288d1; padding: 15px; border-radius: 10px; margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📮 郵務人生模擬器 V5.0</h1>

    <!-- 階段 1：設定 -->
    <div id="setup-page">
        <div class="setup-group">
            <label for="player-name">郵務士姓名：</label>
            <input type="text" id="player-name" value="郵小弟">
        </div>
        <div class="setup-group">
            <label for="player-age">入職起始年齡：</label>
            <input type="number" id="player-age" value="18" min="18" max="60">
        </div>
        <div class="setup-group">
            <label for="player-section">初次進局分發職位：</label>
            <select id="player-section">
                <option value="混投段">1. 混投段（平信/掛號/包裹混投、路段複雜、重視熟練與人緣）</option>
                <option value="快捷包裹段">2. 快捷包裹段（重包裹多、時效緊迫、重視體能與應變）</option>
            </select>
        </div>
        <div class="setup-group">
            <label for="player-code">選擇天賦傾向（將隱藏至退休結算）：</label>
            <select id="player-code">
                <option value="A">【天賦 A】路線敏銳（路線熟練與人緣加成）</option>
                <option value="B">【天賦 B】靈敏應變（處事應變與向上管理加成）</option>
                <option value="C">【天賦 C】鋼鐵體魄（體能強度與路線熟練加成）</option>
            </select>
        </div>
        <button class="btn-action" onclick="startGame()">正式進局報到！</button>
    </div>

    <!-- 階段 2：主遊戲畫面 -->
    <div id="game-page" class="hidden">
        <div class="status-bar">
            <div class="status-item">年齡 / 當前職務<span id="stat-age">18歲</span></div>
            <div class="status-item">考績甲等累計<span id="stat-eval">0 次</span></div>
        </div>

        <!-- 薪資狀態欄 -->
        <div class="salary-bar">
            💰 當前薪級：<span id="stat-paygrade">55 級</span> | 月薪：<span id="stat-salary">36,250 元</span>
            <br>💼 累積生涯總收入：<span id="stat-total-earnings">0 元</span>
        </div>

        <!-- 屬性加點面板 -->
        <div class="stats-panel">
            <div class="stats-header">
                <span>📊 屬性能力值 (上限 20)</span>
                <span style="color:#d32f2f;">可分配點數：<span id="stat-points">0</span></span>
            </div>
            <div class="stat-row">
                <span>⚡ 體能強度：<b id="val-stamina">10</b>/20</span>
                <button class="btn-add" id="btn-add-stamina" onclick="addPoint('stamina')">+1</button>
            </div>
            <div class="stat-row">
                <span>🗺️ 路線熟練度：<b id="val-route">10</b>/20</span>
                <button class="btn-add" id="btn-add-route" onclick="addPoint('route')">+1</button>
            </div>
            <div class="stat-row">
                <span>👔 向上管理：<b id="val-management">10</b>/20</span>
                <button class="btn-add" id="btn-add-management" onclick="addPoint('management')">+1</button>
            </div>
            <div class="stat-row">
                <span>📚 處事與應變：<b id="val-smart">10</b>/20</span>
                <button class="btn-add" id="btn-add-smart" onclick="addPoint('smart')">+1</button>
            </div>
            <div class="stat-row">
                <span>🤝 人緣社交：<b id="val-relationship">10</b>/20</span>
                <button class="btn-add" id="btn-add-relationship" onclick="addPoint('relationship')">+1</button>
            </div>
        </div>

        <!-- 職務切換彈窗 -->
        <div id="role-modal" class="modal hidden">
            <h3>🔄 申請調換職務段別</h3>
            <p>請選擇你想申請調任的職位：</p>
            <div id="role-options-container"></div>
            <br>
            <button class="btn-action" style="background:#757575;" onclick="closeRoleModal()">取消</button>
        </div>

        <!-- 考轉內勤彈窗 -->
        <div id="exam-modal" class="modal hidden">
            <h3>🎉 恭喜通過內部升遷考試！</h3>
            <p>你已取得轉任內勤人員的資格，請問你的選擇是？</p>
            <button class="btn-action" onclick="chooseOfficeLife()">1. 結束外勤生涯，順利轉內勤辦公室人生（遊戲通關結算）</button>
            <button class="btn-action btn-exam" onclick="chooseReturnField()">2. 適應不良！冷氣房不適合我，申請退貨重回外勤！</button>
        </div>

        <div class="event-card">
            <div class="event-title" id="event-title">準備出勤</div>
            <div class="event-desc" id="event-desc">點擊下方按鈕開始進行今年的業務！</div>
            <div id="log-container"></div>
        </div>

        <div class="choices-container" id="choices-container"></div>

        <button id="btn-main" class="btn-action" onclick="startYear()">進行今年業務</button>
        <button id="btn-change-role" class="btn-action btn-role" onclick="openRoleModal()">🔄 申請調換職務</button>
        <button id="btn-exam" class="btn-action btn-exam" onclick="takeExam()">🔒 升遷考試（須任職滿 3 年）</button>
    </div>

    <!-- 階段 3：退休/通關結算 -->
    <div id="result-page" class="hidden">
        <h2 id="result-header">🏆 郵務生涯榮退報告</h2>
        <div id="summary-content" style="line-height: 1.8; background:#fff8e1; padding:15px; border-radius:10px;"></div>
        <br>
        <button class="btn-action" onclick="location.reload()">重新體驗新天賦</button>
    </div>
</div>

<script>
    const SALARY_TABLE = {
        55: 36250, 54: 37405, 53: 38640, 52: 39885, 51: 41130,
        50: 42370, 49: 43600, 48: 44850, 47: 46090, 46: 47325,
        45: 48560, 44: 49775, 43: 50470, 42: 51190, 41: 51890,
        40: 52590, 39: 53290, 38: 53995, 37: 54695, 36: 55395
    };

    let player = {
        name: "", code: "A", age: 18, startAge: 18,
        role: "混投段",
        points: 3,
        stats: { stamina: 10, route: 10, management: 10, smart: 10, relationship: 10 },
        delivered: 0, gradeA: 0,
        examPassed: false,
        payGrade: 55,
        totalEarnings: 0
    };

    const MAX_STAT = 20;

    function startGame() {
        player.name = document.getElementById("player-name").value || "郵小弟";
        player.startAge = parseInt(document.getElementById("player-age").value) || 18;
        player.age = player.startAge;
        player.code = document.getElementById("player-code").value;
        player.role = document.getElementById("player-section").value;

        if (player.role === "快捷包裹段") {
            player.stats.stamina += 3; player.stats.smart += 2;
        } else {
            player.stats.route += 3; player.stats.relationship += 2;
        }

        if (player.code === "A") { player.stats.route += 2; player.stats.relationship += 1; }
        if (player.code === "B") { player.stats.smart += 2; player.stats.management += 1; }
        if (player.code === "C") { player.stats.stamina += 2; player.stats.route += 1; }

        document.getElementById("setup-page").classList.add("hidden");
        document.getElementById("game-page").classList.remove("hidden");
        updateUI();
    }

    function updateUI() {
        document.getElementById("stat-age").innerText = `${player.age}歲 (${player.role})`;
        document.getElementById("stat-eval").innerText = `${player.gradeA} 次`;
        document.getElementById("stat-points").innerText = player.points;

        document.getElementById("stat-paygrade").innerText = `${player.payGrade} 級${player.payGrade === 36 ? " (碰頂)" : ""}`;
        document.getElementById("stat-salary").innerText = `${SALARY_TABLE[player.payGrade].toLocaleString()} 元`;
        document.getElementById("stat-total-earnings").innerText = `${Math.round(player.totalEarnings).toLocaleString()} 元`;

        for (let key in player.stats) {
            if (player.stats[key] > MAX_STAT) player.stats[key] = MAX_STAT;
            if (player.stats[key] < 1) player.stats[key] = 1;
            
            document.getElementById(`val-${key}`).innerText = player.stats[key];
            document.getElementById(`btn-add-${key}`).disabled = (player.points <= 0 || player.stats[key] >= MAX_STAT);
        }

        let examUnlockAge = player.startAge + 3;
        let examBtn = document.getElementById("btn-exam");
        
        if (player.examPassed) {
            examBtn.disabled = true;
            examBtn.innerText = "✅ 已通過內部升遷考試";
        } else if (player.age < examUnlockAge) {
            examBtn.disabled = true;
            examBtn.innerText = `🔒 升遷考試（須任職滿 3 年，還差 ${examUnlockAge - player.age} 年）`;
        } else {
            examBtn.disabled = false;
            examBtn.innerText = "📝 參加內部升遷考試";
        }
    }

    function addPoint(statKey) {
        if (player.points > 0 && player.stats[statKey] < MAX_STAT) {
            player.stats[statKey]++;
            player.points--;
            updateUI();
        }
    }

    // 職務與對應專屬事件庫
    const roleEvents = {
        "混投段": [
            {
                title: "📮 混投段：門牌混亂與凶惡惡犬",
                desc: "今天送到老舊巷弄，門牌亂七八糟，甚至還有一隻沒繫繩的黑狗衝出來！",
                options: [
                    {
                        text: "a) 拿郵件包擋住，冷靜慢慢後退",
                        result: "順利避開咬傷，展現良好應變能力。",
                        changes: { smart: 1 }, addPoints: 1, grade: true
                    },
                    {
                        text: "b) 大聲跟住戶求救並反應路段狀況",
                        result: "熱心鄰居出來幫忙拉住狗，順便指引正確門牌，人緣提升！",
                        changes: { relationship: 1 }, addPoints: 1, grade: false
                    }
                ]
            }
        ],
        "快捷包裹段": [
            {
                title: "📦 快捷包裹段：電梯故障硬扛重物",
                desc: "頂樓住戶訂了 3 箱礦泉水，偏偏公寓完全沒有電梯！",
                options: [
                    {
                        text: "a) 硬扛一口氣扛上五樓！",
                        result: "累到滿頭大汗，但體能大幅提升，客人給予讚賞！",
                        changes: { stamina: 1 }, addPoints: 1, grade: true
                    },
                    {
                        text: "b) 電聯收件人詢問是否能下樓協助",
                        result: "收件人體諒辛苦下來幫忙拿了一箱，應變加分。",
                        changes: { smart: 1 }, addPoints: 0, grade: false
                    }
                ]
            }
        ],
        "半夜接送收攬": [
            {
                title: "🌙 半夜班：大司機嫌臭與深夜大宗郵件",
                desc: "半夜搬運大宗郵袋，夜班大司機走近你身邊皺眉：「靠，你身上汗味很重欸！」",
                options: [
                    {
                        text: "a) 向股長抱怨，宣稱該司機很難配合",
                        result: "股長出面協調，但也讓局內管理層注意到爭執，向上管理與人緣受到影響。",
                        changes: { management: -1, relationship: -1 }, addPoints: 0, grade: false
                    },
                    {
                        text: "b) 默默吞下，尷尬地笑笑退後一步",
                        result: "氣氛稍微有點尷尬，但保全了職場和氣。",
                        changes: { relationship: -1 }, addPoints: 0, grade: false
                    }
                ]
            }
        ],
        "白天接送收攬": [
            {
                title: "🚚 白天接送收攬：大公司突發爆量包裹",
                desc: "前往園區大樓收攬，廠商突然臨時多出 200 箱包裹，車子快塞不下了！",
                options: [
                    {
                        text: "a) 展現疊高高神技，發揮極致空間利用率",
                        result: "完美將包裹全數塞入大郵車，體能與路線熟練大提升！",
                        changes: { stamina: 1, route: 1 }, addPoints: 1, grade: true
                    },
                    {
                        text: "b) 電聯局內請求二班調派支援車輛",
                        result: "成功協調調派支援，展現優秀的向上管理與調配能力。",
                        changes: { management: 1, smart: 1 }, addPoints: 1, grade: true
                    }
                ]
            }
        ],
        "稽查": [
            {
                title: "🔍 稽查：處理民眾嚴重的惡意客訴",
                desc: "有民眾衝到局裡拍桌飆罵，指控郵務士投遞不公，身為稽查的你必須出面談判！",
                options: [
                    {
                        text: "a) 耐心傾聽並依規定調閱投遞簽收軌跡",
                        result: "用專業數據與條理化解糾紛，展現頂級處事應變與向上管理！",
                        changes: { smart: 2, management: 1 }, addPoints: 1, grade: true
                    },
                    {
                        text: "b) 倒茶安撫民眾情緒，並私人私下贈送局裡宣導小贈品",
                        result: "民眾氣消離開，展現極強的人緣社交實力。",
                        changes: { relationship: 2 }, addPoints: 1, grade: true
                    }
                ]
            }
        ]
    };

    function startYear() {
        if (player.age >= 65) { endGame(false); return; }

        document.getElementById("btn-main").classList.add("hidden");
        document.getElementById("log-container").innerHTML = "";

        player.points += 1;

        let currentPool = roleEvents[player.role] || roleEvents["混投段"];
        let evt = currentPool[Math.floor(Math.random() * currentPool.length)];

        document.getElementById("event-title").innerText = `📅 【${player.age} 歲】 ${evt.title}`;
        document.getElementById("event-desc").innerText = evt.desc;

        let container = document.getElementById("choices-container");
        container.innerHTML = "";
        evt.options.forEach((opt) => {
            let btn = document.createElement("button");
            btn.className = "btn-choice";
            btn.innerText = opt.text;
            btn.onclick = () => processChoice(opt);
            container.appendChild(btn);
        });
    }

    function processChoice(opt) {
        let changeLogs = [];

        let currentMonthly = SALARY_TABLE[player.payGrade];
        let annualSalary = currentMonthly * 16.5;
        player.totalEarnings += annualSalary;

        let salaryLog = `今年月薪：${currentMonthly.toLocaleString()} 元 (薪級 ${player.payGrade} 級)`;

        if (player.payGrade > 36) {
            player.payGrade--;
            salaryLog += ` ➔ 明年順利跳一級至 ${player.payGrade} 級 (${SALARY_TABLE[player.payGrade].toLocaleString()}元/月)`;
        } else {
            salaryLog += ` (專二薪級已達 36 級碰頂！)`;
        }

        if (opt.changes) {
            for (let key in opt.changes) {
                player.stats[key] += opt.changes[key];
                let nameMap = { stamina: "體能", route: "路線", management: "向上管理", smart: "處事與應變", relationship: "人緣" };
                let valStr = opt.changes[key] > 0 ? `+${opt.changes[key]}` : `${opt.changes[key]}`;
                changeLogs.push(`${nameMap[key]} ${valStr}`);
            }
        }

        if (opt.addPoints > 0) {
            player.points += opt.addPoints;
            changeLogs.push(`獲得自由點數 +${opt.addPoints}`);
        }

        if (opt.grade) {
            player.gradeA++;
            changeLogs.push(`獲得考績甲等`);
        }

        player.delivered += Math.floor(player.stats.route * 1200 + 8000);

        let logText = `📢 <b>【選擇結果】</b><br>${opt.result}<br><br>💵 <b>【薪資結算】</b><br>${salaryLog}<br><br><b>📈 能力影響：</b> ${changeLogs.length > 0 ? changeLogs.join(" | ") : "無能力變動"}`;
        
        document.getElementById("choices-container").innerHTML = "";
        document.getElementById("log-container").innerHTML = `<div class="log-box">${logText}</div>`;

        player.age++;
        updateUI();

        let mainBtn = document.getElementById("btn-main");
        mainBtn.classList.remove("hidden");
        mainBtn.innerText = player.age >= 65 ? "觀看榮退報告" : "推進到下一年";
    }

    // 職務彈窗邏輯
    function openRoleModal() {
        let years = player.age - player.startAge;
        let container = document.getElementById("role-options-container");
        container.innerHTML = "";

        let roles = [
            { name: "混投段", req: "無條件（初始職位）", fit: true },
            { name: "快捷包裹段", req: "無條件（初始職位）", fit: true },
            { name: "半夜接送收攬", req: "任職滿 3 年", fit: years >= 3 },
            { name: "白天接送收攬", req: "任職滿 3 年", fit: years >= 3 },
            { name: "稽查", req: "任職滿 5 年 且 考績甲等 3 次", fit: (years >= 5 && player.gradeA >= 3) }
        ];

        roles.forEach(r => {
            let btn = document.createElement("button");
            btn.className = "btn-action";
            if (r.fit) {
                btn.innerText = `轉任：${r.name} (${r.name === player.role ? "當前職務" : "可調任"})`;
                if (r.name === player.role) btn.disabled = true;
                btn.onclick = () => switchRole(r.name);
            } else {
                btn.innerText = `🔒 ${r.name} (未解鎖：${r.req})`;
                btn.disabled = true;
                btn.style.backgroundColor = "#b0bec5";
            }
            container.appendChild(btn);
        });

        document.getElementById("role-modal").classList.remove("hidden");
    }

    function closeRoleModal() {
        document.getElementById("role-modal").classList.add("hidden");
    }

    function switchRole(newRole) {
        player.role = newRole;
        closeRoleModal();
        alert(`成功調任為：【${newRole}】！`);
        updateUI();
    }

    function takeExam() {
        document.getElementById("exam-modal").classList.remove("hidden");
    }

    function chooseOfficeLife() {
        player.examPassed = true;
        document.getElementById("exam-modal").classList.add("hidden");
        endGame(true);
    }

    function chooseReturnField() {
        player.examPassed = true;
        player.role = `內勤退貨返外勤`;
        document.getElementById("exam-modal").classList.add("hidden");
        alert("你選擇退貨回外勤！現在你隨時可以在『申請調換職務』中切換至包含半夜班在內的各種外勤職務！");
        updateUI();
    }

    function endGame(isOfficeWin = false) {
        document.getElementById("game-page").classList.add("hidden");
        document.getElementById("result-page").classList.remove("hidden");

        let codeNameMap = {
            "A": "【天賦 A：路線敏銳】",
            "B": "【天賦 B：靈敏應變】",
            "C": "【天賦 C：鋼鐵體魄】"
        };

        let finalTitle = `【${player.role}專業職】`;
        if (isOfficeWin) {
            document.getElementById("result-header").innerText = "🎉 順利轉內勤．遊戲圓滿通關！";
            finalTitle = "【冷氣房辦公室大師．成功上岸】";
        }

        document.getElementById("summary-content").innerHTML = `
            <b>姓名：</b> ${player.name}<br>
            <b>開局設定：</b> ${player.startAge} 歲入職<br>
            <b>揭曉初始天賦：</b> <span style="color:#0288d1; font-weight:bold;">${codeNameMap[player.code]}</span><br>
            <b>最終生涯稱號：</b> <span style="font-size:18px; color:#008751; font-weight:bold;">${finalTitle}</span><br>
            <hr>
            📊 <b>最終能力總結：</b><br>
            - 體能: ${player.stats.stamina} / 熟練: ${player.stats.route} / 向上管理: ${player.stats.management} / 應變: ${player.stats.smart} / 人緣: ${player.stats.relationship}<br>
            <hr>
            💰 <b>最終薪級：</b> ${player.payGrade} 級 (月薪 ${SALARY_TABLE[player.payGrade].toLocaleString()} 元)<br>
            💵 <b>生涯薪資總收入：</b> <span style="color:#d32f2f; font-weight:bold;">${Math.round(player.totalEarnings).toLocaleString()} 元</span><br>
            📮 <b>生涯處理郵件總數：</b> ${player.delivered.toLocaleString()} 件<br>
            🏆 <b>獲得考績甲等：</b> ${player.gradeA} 次<br>
            💼 <b>退休身分：</b> ${isOfficeWin ? "內勤人員" : player.role}<br>
        `;
    }
</script>
</body>
</html>
